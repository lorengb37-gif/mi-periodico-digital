<!doctype html>
<html lang="es-DO" class="cargando">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Pulso Publicitario</title>
<meta name="description" content="Publicidad, mercadeo y ad tech pa’ la gente de agencia, con zoom a RD.">
<meta name="theme-color" content="#E9E4DB">
<link rel="stylesheet" href="fuentes/fuentes.css">
<link rel="stylesheet" href="comun/comun.css">
<link rel="stylesheet" href="estilos.css">
<link rel="stylesheet" href="interactivos.css">
</head>
<body>
<div class="precarga" id="precarga" aria-hidden="true">
  <p class="precarga__l">Pintando la edición</p>
  <p class="precarga__n">N.º <span id="precargaNum">000</span></p>
</div>

<a class="saltar" href="#edicion">Saltar a la edición</a>

<header class="fachada" id="fachada">
  <a class="fachada__marca" href="#/" aria-label="El Pulso Publicitario, portada">
    <span class="fachada__nombre">El Pulso</span>
    <span class="fachada__num" id="fachadaNum"></span>
  </a>
  <nav class="fachada__paredes" aria-label="Departamentos" id="paredesNav"></nav>
  <button class="fachada__60" type="button" data-rapida aria-pressed="false">
    <span class="fachada__60-n">60</span><span class="fachada__60-s">s</span>
    <span class="sr">Vista rápida</span>
  </button>
  <div class="zocalo" id="zocalo" aria-hidden="true"></div>
</header>

<main id="edicion" tabindex="-1"></main>
<article id="nota" class="nota" hidden tabindex="-1" aria-live="polite"></article>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>

<script src="contenido/archivo.js"></script>

<script src="app.js"></script>
<script src="calendario.js"></script>
<script src="interactivos.js"></script>

</html>
